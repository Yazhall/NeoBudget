name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (Symfony)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, curl

      - name: Create .env file
        run: |
          echo "APP_ENV=test" > backend/.env
          echo "APP_SECRET=$(php -r 'echo bin2hex(random_bytes(16));')" >> backend/.env
          echo "DEFAULT_URI=http://localhost" >> backend/.env

      - name: Install dependencies
        run: composer install --working-dir=backend

      - name: Install PHPUnit
        run: cd backend && composer require --dev phpunit/phpunit

      - name: Run tests
        run: cd backend && ./vendor/bin/phpunit

  frontend:
    name: Frontend (Vue.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd frontend && npm install

      - name: Run tests
        run: cd frontend && npm run test:unit